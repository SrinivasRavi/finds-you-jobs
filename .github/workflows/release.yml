name: Release (beta, macOS signed)

# Push to the `release` branch → native builds on every OS → one GitHub
# Release tagged `v<version>-beta`, marked pre-release, with every installer
# attached. "Merge and forget": nothing here needs a manual re-run once the
# push lands (docs/internal/distribution.md section 7).
#
# Why it looks the way it does:
# - Native runners per OS/arch, never cross-compiled: PyInstaller cannot
#   cross-compile the sidecar at all, and macOS universal2 is a gamble this
#   dependency set doesn't support (distribution.md section 1).
# - `-beta` lives in the tag and the *filenames only*. The embedded bundle
#   version stays strictly numeric ("0.5.1") because WiX/MSI rejects
#   non-numeric pre-release suffixes outright — that was a real build
#   failure, not a hypothetical (distribution.md section 2a).
# - The macOS legs sign and notarize; Windows and Linux stay unsigned (ship
#   unsigned before ship late, distribution.md section 1 — Windows signing is
#   the Microsoft Store path, tracked separately in status.md). The signing
#   env vars slotted into the build step without restructuring anything, as
#   the original note promised (apple-signing.md section 9).
# - fail-fast off + release publishes whatever legs succeeded: one broken
#   leg (Linux is the least-proven) must not block the download button for
#   the platforms that work. The failed leg still shows red in CI.
on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Runner-image lifecycle matters here: macos-13 (the old Intel
          # image) was retired Dec 2025 — a job pinned to it queues for 24h
          # and is auto-cancelled (observed on the first release run).
          # macos-15-intel is GitHub's designated Intel label, supported
          # until Fall 2027, after which x86_64 macOS runners end entirely
          # and the Intel .dmg needs a new plan (Rosetta cross-build, or
          # dropping Intel). macos-14 began deprecation 2026-07, hence
          # macos-15 for the arm64 leg.
          - os: macos-15 # Apple Silicon, native
            label: macos-arm64
          - os: macos-15-intel # Intel, native
            label: macos-x64
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-22.04
            label: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies (Tauri prerequisites)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Install uv
        # No `python-version:` input — astral-sh/setup-uv doesn't have one;
        # `.python-version` (3.13) is the source of truth (see
        # build-windows.yml for the history).
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install pnpm
        # No explicit `version:` — package.json's `packageManager` field is
        # the single source of truth; pnpm/action-setup errors if both are
        # given.
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install project dependencies
        run: pnpm boot

      - name: Import the Apple signing identity (macOS legs)
        # A throwaway per-run keychain, made the default so both
        # `sign-sidecar-macos.sh` and Tauri's own bundler find the identity
        # without either of them creating a second one. The identity's common
        # name is read back out of the keychain rather than hardcoded: the
        # certificate carries the Apple account holder's legal name, which has
        # no business sitting in a public workflow file, and reading it means a
        # reissued certificate needs no edit here (apple-signing.md section 2a).
        if: startsWith(matrix.os, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/fyj-signing.keychain-db"
          P12="$RUNNER_TEMP/fyj-developer-id.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without the partition list, codesign prompts for keychain access and
          # a headless runner hangs until the job times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$P12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          [ -n "$IDENTITY" ] || {
            echo "no Developer ID Application identity in the keychain" >&2; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Stage the notarization API key (macOS legs)
        # Tauri wants a PATH to the .p8, not its contents, so the secret is
        # written out here and the path exported for the build step.
        if: startsWith(matrix.os, 'macos')
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Build the PyInstaller sidecar
        # Build-only tooling (pyproject.toml's `build` dependency group),
        # kept out of the default dev install.
        run: |
          uv sync --group build
          uv run pyinstaller sidecar/fyj-sidecar.spec --noconfirm

      - name: Deep-sign the sidecar's Mach-O binaries (macOS legs)
        # Must sit between PyInstaller and `tauri build`: Tauri signs the app
        # bundle but does not recurse into Resources, and notarization rejects
        # any embedded Mach-O without a Developer ID signature and a secure
        # timestamp (rejected live 2026-08-08; apple-signing.md section 7).
        if: startsWith(matrix.os, 'macos')
        run: ./scripts/sign-sidecar-macos.sh

      - name: Build the app (codegen + frontend + tauri bundle)
        # Signing the updater artifacts needs the Ed25519 private key at build
        # time. With bundle.createUpdaterArtifacts:true the build FAILS if the
        # key is absent — deliberately: better a loud failure than a release
        # whose updates no client can verify. Set the two secrets (see
        # distribution.md section 9) before pushing to `release`. Empty password is
        # fine if the key was generated without one.
        #
        # The Apple vars drive codesign + notarize + staple on the macOS legs.
        # APPLE_SIGNING_IDENTITY arrives from the keychain-import step above.
        # Tauri reads all of these only on macOS, so the empty values the other
        # legs see are inert.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: pnpm run build

      - name: Staple the notarization ticket to the .dmg
        # Tauri notarizes and staples the .app, then wraps it in a .dmg it does
        # NOT staple (v0.5.7-beta failed here, run 32344110704). The .dmg is the
        # artifact the user downloads and the one macOS quarantines, so it wants
        # its own ticket: without one, first launch needs a live network round
        # trip to Apple, and an offline install shows the "damaged" dialog the
        # whole signing effort exists to remove.
        #
        # Staple first: if Tauri's submission already covered the .dmg, Apple
        # has the ticket and this is instant and free. Only if that misses do we
        # submit the .dmg on its own, which is the slow path.
        if: startsWith(matrix.os, 'macos')
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg)
          if xcrun stapler staple "$DMG"; then
            echo "stapled from Apple's existing record"
          else
            echo "no ticket for the .dmg yet — submitting it on its own"
            xcrun notarytool submit "$DMG" \
              --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER" \
              --wait --timeout 30m
            xcrun stapler staple "$DMG"
          fi

      - name: Report whether the .dmg carries an icon layout
        # Tauri positions the .dmg's icons by driving Finder over AppleScript,
        # which can fail on a headless runner; when it does, the disk image has
        # no .DS_Store, Finder auto-arranges alphabetically, and "Applications"
        # sorts to the LEFT of the app — backwards from the drag-right gesture
        # every Mac user knows. Reported, never fatal: this is cosmetic, and a
        # cosmetic assertion is exactly what failed v0.5.7-beta's first run.
        if: startsWith(matrix.os, 'macos')
        run: |
          set -uo pipefail
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg)
          MP=$(hdiutil attach -readonly -nobrowse -mountrandom /tmp "$DMG" \
            | awk -F'\t' '/Apple_(HFS|APFS)/ {print $NF}' | tail -1)
          if [ -f "$MP/.DS_Store" ]; then
            echo "layout OK: the .dmg carries a .DS_Store, icons are positioned"
          else
            echo "LAYOUT MISSING: no .DS_Store — Finder will auto-arrange and put"
            echo "Applications left of the app. bundle.macOS.dmg did not take."
          fi
          ls -la "$MP"
          hdiutil detach "$MP" -quiet || true

      - name: Prove the macOS bundle is signed, notarized, and stapled
        # The build claiming success is not the bar — a notarization that
        # silently no-ops still produces a .dmg. The app checks are the same
        # ones the local proving run used (apple-signing.md section 7).
        #
        # Only assertions with observed evidence behind them are fatal. codesign
        # and spctl both passed on the v0.5.7-beta run, and the step above now
        # guarantees the .dmg staple, so those 3 fail the leg. Whether Tauri also
        # staples the .app is reported but NOT enforced: over-asserting an
        # unverified property is exactly what sank v0.5.7-beta, and the .app's
        # ticket is moot once the .dmg carries one.
        if: startsWith(matrix.os, 'macos')
        run: |
          set -euo pipefail
          APP=src-tauri/target/release/bundle/macos/finds-you-jobs.app
          DMG=$(ls src-tauri/target/release/bundle/dmg/*.dmg)
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl -a -t exec -vv "$APP" 2>&1 | tee /tmp/spctl.txt
          grep -q "Notarized Developer ID" /tmp/spctl.txt
          xcrun stapler validate "$DMG"
          xcrun stapler validate "$APP" \
            && echo "note: the .app carries its own ticket too" \
            || echo "note: the .app has no staple of its own; the .dmg's ticket covers the download"

      - name: Collect installers + updater artifacts, stamp -beta into filenames
        # `-beta` is added HERE, to the distributed filenames only — the
        # embedded version must stay numeric for MSI (see header comment).
        # Alongside the first-install installers we also collect the updater
        # packages (macOS .app.tar.gz, and the .sig for each updater target) so
        # the release job can build latest.json. The same VERSION→VERSION-beta
        # rename keeps each artifact paired with its .sig by name.
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p dist-beta
          shopt -s nullglob
          # Installers + Windows/Linux updater sigs: these filenames already
          # carry the version, so the VERSION→VERSION-beta rename is enough.
          # Windows and Linux keep Tauri's names: `_amd64.deb` and
          # `name-version-release.arch.rpm` are what Debian policy and RPM
          # expect, so "fixing" them would be the actual mistake.
          for f in src-tauri/target/release/bundle/nsis/*.exe \
                   src-tauri/target/release/bundle/nsis/*.sig \
                   src-tauri/target/release/bundle/msi/*.msi \
                   src-tauri/target/release/bundle/msi/*.sig \
                   src-tauri/target/release/bundle/deb/*.deb \
                   src-tauri/target/release/bundle/appimage/*.AppImage \
                   src-tauri/target/release/bundle/appimage/*.sig \
                   src-tauri/target/release/bundle/rpm/*.rpm; do
            base=$(basename "$f")
            cp "$f" "dist-beta/${base/${VERSION}/${VERSION}-beta}"
          done
          # macOS gets names a Mac user can read. Tauri ships
          # `finds-you-jobs_0.5.7_aarch64.dmg`: "aarch64" is the compiler's word
          # for the architecture and appears on no Apple surface, and underscores
          # are not the convention for Mac downloads. Apple says arm64 and Intel,
          # so the download says arm64 and intel.
          #
          # The .app.tar.gz updater bundle additionally arrives as bare
          # "<product>.app.tar.gz" with NO version and NO arch, so both Mac legs
          # would collide on the release and the manifest could not tell the two
          # apart. Both artifacts are named here, together, from one ARCH.
          case "${{ matrix.label }}" in
            macos-arm64) ARCH=arm64 ;;
            macos-x64)   ARCH=intel ;;
            *)           ARCH="" ;;
          esac
          if [ -n "$ARCH" ]; then
            STEM="finds-you-jobs-${VERSION}-beta-${ARCH}"
            for f in src-tauri/target/release/bundle/dmg/*.dmg; do
              cp "$f" "dist-beta/${STEM}.dmg"
            done
            for f in src-tauri/target/release/bundle/macos/*.app.tar.gz; do
              cp "$f" "dist-beta/${STEM}.app.tar.gz"
              cp "${f}.sig" "dist-beta/${STEM}.app.tar.gz.sig"
            done
          fi
          ls -la dist-beta
          [ -n "$(ls -A dist-beta)" ] # fail loudly if nothing was bundled

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: beta-${{ matrix.label }}
          path: dist-beta/*
          if-no-files-found: error

  release:
    needs: build
    # Publish whatever legs succeeded even if one failed (header comment) —
    # but never on cancellation.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: ver
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all installer artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Refuse to publish an empty release
        run: |
          ls -la dist
          [ -n "$(ls -A dist)" ]

      - name: Build the auto-update manifest (latest.json)
        # Reads the .sig files + updater artifacts in dist/, emits latest.json,
        # then moves the .sig files out so they don't clutter the user-facing
        # release (their contents are already embedded in the manifest).
        run: |
          node scripts/build-updater-manifest.mjs \
            dist \
            "${{ steps.ver.outputs.version }}" \
            "v${{ steps.ver.outputs.version }}-beta" \
            latest.json
          mkdir -p _sigs && mv dist/*.sig _sigs/ 2>/dev/null || true

      - name: Create/update the versioned GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}-beta
          name: finds-you-jobs v${{ steps.ver.outputs.version }}-beta
          prerelease: true
          files: dist/*
          body: |
            **Beta build.** The macOS builds are signed and notarized by Apple
            and open on first launch. Windows and Linux are still unsigned, so
            Windows pushes back once. The exact step that works per OS:

            | OS | Download | First-launch note |
            |---|---|---|
            | macOS (Apple Silicon) | the `*-arm64.dmg` | Drag into **Applications** and open it. No `xattr`, no warnings |
            | macOS (Intel) | the `*-intel.dmg` | same as above |
            | Windows | the `*-setup.exe` (NSIS) — or the `.msi` if you prefer | SmartScreen: **More info → Run anyway** |
            | Linux | the `.AppImage` (portable), `.deb` (Debian/Ubuntu), or `.rpm` (Fedora) | `chmod +x` the AppImage |

            Already on a build with in-app updates? Settings › About › **Check
            for updates** pulls this release directly. Your data is preserved.

            The app is fully local: your data stays on your machine, and LLM
            calls go directly to the provider whose key you bring.

      - name: Publish the auto-update manifest to the fixed `latest` tag
        # The app's updater endpoint points at this stable URL
        # (releases/download/latest/latest.json). Kept a pre-release so it never
        # steals the "Latest" badge from the real versioned releases; direct-tag
        # download works regardless of that flag.
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Auto-update manifest
          prerelease: true
          files: latest.json
          body: |
            Machine-readable manifest the in-app updater polls. **Don't download
            this** — get the app from the versioned releases on the Releases page.
