<!DOCTYPE html>
<html>
<head><title>Apply — Staff Engineer at Acme</title></head>
<body>
  <h1>Apply for Staff Engineer</h1>
  <form id="application" action="#" method="post">
    <label for="name">Full name</label>
    <input id="name" name="name" type="text" required />

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required />

    <label for="linkedin">LinkedIn profile URL</label>
    <input id="linkedin" name="linkedin" type="text" />

    <div id="resume-dropzone" role="button" tabindex="0"
         aria-label="Upload your resume (drag and drop or click to browse)">
      Drag your resume here, or click to browse
      <input id="resume" name="resume" type="file"
             style="position:absolute;left:-9999px;height:1px;width:1px" />
    </div>

    <button type="submit">Submit application</button>
  </form>
</body>
</html>
